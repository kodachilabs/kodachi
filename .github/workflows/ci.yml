name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # No codex binary needed: the unit, parity, wire-trace and transport tests all run
      # against committed fixtures and an in-memory transport. Integration tests are gated
      # behind -DcodexIntegration=true and spend real quota, so they stay out of CI.
      - name: Build and test
        run: ./gradlew build

      - name: Verify the published artifact resolves
        run: ./gradlew :kodachi:publishToMavenLocal
