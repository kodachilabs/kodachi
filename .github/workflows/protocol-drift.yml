name: Protocol drift

# Codex ships often. This watches for a protocol change and, when it finds one, does the
# mechanical part (regenerate + build) and opens a PR with the result. A human still reviews,
# because only a human can judge a breaking change — but nobody has to notice the release.
on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      codex_version:
        description: 'Codex CLI version to check against (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Codex CLI
        id: codex
        run: |
          npm install -g "@openai/codex@${{ inputs.codex_version || 'latest' }}"
          echo "version=$(codex --version)" >> "$GITHUB_OUTPUT"

      # Schema emission is a static dump and needs no login, unlike a real turn. If a future
      # release changes that, this step is where it will fail, loudly.
      - name: Check for drift
        id: check
        run: |
          if python3 scripts/generate_protocol.py --check | tee drift.txt; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
          # Surface the report on the run summary and make it reusable in the PR body.
          {
            echo '## Protocol drift'
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'report<<DRIFT_EOF'
            cat drift.txt
            echo 'DRIFT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate
        if: steps.check.outputs.drifted == 'true'
        run: python3 scripts/generate_protocol.py

      # Runs only the tests that need no authenticated binary. The integration tests stay
      # opt-in (-DcodexIntegration=true) because they spend real quota.
      - name: Build and test against the regenerated layer
        id: build
        if: steps.check.outputs.drifted == 'true'
        continue-on-error: true
        run: ./gradlew build

      - name: Open a pull request
        if: steps.check.outputs.drifted == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/protocol-${{ steps.codex.outputs.version }}
          title: 'chore: regenerate protocol for ${{ steps.codex.outputs.version }}'
          commit-message: 'chore: regenerate protocol layer for ${{ steps.codex.outputs.version }}'
          labels: protocol
          body: |
            Automated regeneration — `${{ steps.codex.outputs.version }}` changed the app-server protocol.

            **Build result: `${{ steps.build.outcome }}`**

            - `success` — additive release. New methods and notifications are typed and callable;
              this is safe to merge once the diff looks sane.
            - `failure` — either coverage regressed (a parity test names it) or upstream made a
              breaking change and the hand-written layer needs an edit. Check the build log; the
              compiler points at every line that assumed the old shape.

            <details><summary>Drift report</summary>

            ```
            ${{ steps.check.outputs.report }}
            ```
            </details>

            Generated by `.github/workflows/protocol-drift.yml`.
